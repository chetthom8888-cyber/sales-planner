    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>Sales Planner Pro</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary: #0369a1;
            --accent: #0284c7;
            --bg: #e0f2fe;
            --card-bg: #ffffff;
            --text: #020617;
            --red: #dc2626;
            --red-light: #fca5a5;
            --green: #16a34a;
            --orange: #ea580c;
            --border: #bae6fd;
        }

        * { box-sizing: border-box; }
        ::selection { background-color: #000000 !important; color: #ffffff !important; }

        html, body {
            background-color: var(--bg) !important;
            color: var(--text) !important;
            font-family: 'Battambang', Arial, sans-serif;
            margin: 0; padding: 0;
            font-size: 13px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        input, select, textarea {
            width: 100%; padding: 10px; border: 1.5px solid var(--border);
            border-radius: 8px; font-size: 13px; font-family: 'Battambang', Arial, sans-serif;
            background: #ffffff !important; color: #000000 !important; font-weight: 600;
            transition: border 0.1s ease-in-out, box-shadow 0.1s ease-in-out;
            caret-color: #000000 !important;
        }

        input:focus, select:focus, textarea:focus {
            border: 2px solid #000000 !important;
            outline: none !important;
            box-shadow: 0 0 5px rgba(0,0,0,0.3) !important;
        }

        .top-banner {
            background: #0369a1; color: #ffffff !important;
            padding: 12px 16px; font-size: 15px; font-weight: bold;
            border-bottom: 2px solid #0284c7;
            display: flex; justify-content: space-between; align-items: center;
        }

        .user-pill {
            background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px;
            font-size: 11px; font-weight: normal; display: flex; align-items: center; gap: 6px;
        }

        .nav-tabs {
            display: flex; background: #ffffff;
            border-bottom: 2px solid var(--border);
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1; padding: 10px 6px; text-align: center; font-size: 12px; font-weight: 700;
            background: #ffffff; border: none; cursor: pointer; color: #0369a1;
            border-bottom: 3px solid transparent; white-space: nowrap;
        }
        .tab-btn.active {
            color: #ffffff; border-bottom-color: #0369a1; background: #0284c7;
        }

        .container { padding: 12px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
        .card {
            background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(3, 105, 161, 0.15); border: 1.5px solid var(--border); color: var(--text);
        }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
