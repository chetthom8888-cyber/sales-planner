<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>Sales Planner Pro - Team & GPS</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --primary: #020617;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #020617;
            --red: #dc2626;
            --green: #16a34a;
            --border: #cbd5e1;
        }

        html, body {
            background-color: var(--bg) !important;
            color: var(--text) !important;
            font-family: 'Battambang', Arial, sans-serif;
            margin: 0; padding: 0; font-size: 13px; min-height: 100vh;
        }

        .lang-bar {
            background: #0f172a; padding: 6px 12px; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
        }
        .lang-btn {
            background: #1e293b; color: #fff; border: 1px solid #475569;
            padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; font-weight: bold;
        }
        .lang-btn.active { background: #2563eb; border-color: #60a5fa; }

        .top-banner {
            background: #020617; color: #ffffff; padding: 10px 16px;
            text-align: center; font-size: 13px; font-weight: bold; border-bottom: 2px solid var(--border);
        }

        .user-badge {
            background: #1e293b; color: #38bdf8; padding: 4px 10px;
            font-size: 11px; border-radius: 6px; margin-top: 4px; display: inline-block;
        }

        .nav-tabs { display: flex; background: #ffffff; border-bottom: 2px solid var(--border); overflow-x: auto; }
        .tab-btn {
            flex: 1; padding: 10px 6px; text-align: center; font-size: 12px; font-weight: 700;
            background: #ffffff; border: none; cursor: pointer; color: #475569;
            border-bottom: 3px solid transparent; white-space: nowrap;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: #bae6fd; }

        .container { padding: 12px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
        .card {
            background: var(--card-bg); border-radius: 12px; padding: 14px;
            margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); border: 1.5px solid var(--border);
        }
        h3 { font-size: 14px; color: var(--primary); margin: 0 0 10px 0; font-weight: 700; border-left: 4px solid var(--accent); padding-left: 8px; }

        .btn {
            background-color: var(--green); color: white !important; border: none;
            padding: 10px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
            cursor: pointer; text-align: center; display: inline-block; width: 100%; box-sizing: border-box;
        }
        .btn-blue { background-color: var(--accent); } 
        .btn-red { background-color: var(--red); } 

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
        input, select {
            width: 100%; padding: 10px; border: 1.5px solid var(--border);
            border-radius: 8px; font-size: 13px; font-family: 'Battambang', sans-serif;
            box-sizing: border-box; outline: none; font-weight: 600;
        }

        #missionMapContainer { height: 300px; width: 100%; border-radius: 8px; border: 1.5px solid var(--border); margin-top: 10px; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.88); z-index: 10000; justify-content: center; align-items: center;
        }
        .modal-card {
            background: #ffffff; color: #020617; width: 88%; max-width: 400px;
            border-radius: 16px; padding: 20px; text-align: center;
        }
        
        .team-member-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px; background: #f1f5f9; border-radius: 6px; margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- LANGUAGE BAR -->
    <div class="lang-bar">
        <span style="color:#94a3b8; font-size:11px; font-weight:bold;">🌐 Language / ភាសា:</span>
        <div style="display:flex; gap:4px;">
            <button class="lang-btn active" id="btnLangKm" onclick="changeLanguage('km')">🇰🇭 ខ្មែរ</button>
            <button class="lang-btn" id="btnLangEn" onclick="changeLanguage('en')">🇬🇧 EN</button>
        </div>
    </div>

    <!-- AUTO TELEGRAM PIN / AUTH MODAL -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-card">
            <h2 style="margin-top:0; font-size:16px;">🔐 ផ្ទៀងផ្ទាត់កូដសម្ងាត់ (PIN)</h2>
            <p style="font-size:12px; color:#64748b;" id="tgUserLabel">Telegram: Checking...</p>
            
            <div class="form-group" style="text-align:left;">
                <label>តួនាទី (Role):</label>
                <select id="userRoleSelect" onchange="toggleTeamCodeField()">
                    <option value="member">កូនក្រុម (Sales Member)</option>
                    <option value="leader">មេក្រុម (Team Leader)</option>
                </select>
            </div>

            <div class="form-group" style="text-align:left;">
                <label>កំណត់/បញ្ចូល PIN សម្ងាត់ (4 ខ្ទង់):</label>
                <input type="password" id="userPinInput" maxlength="4" placeholder="****" inputmode="numeric">
            </div>

            <div class="form-group" id="teamCodeGroup" style="text-align:left;">
                <label>លេខកូដក្រុម (Team Code):</label>
                <input type="text" id="teamCodeInput" placeholder="ឧ. TEAM-001">
            </div>

            <button class="btn btn-blue" onclick="saveAuthAndLogin()">ចូលប្រព័ន្ធ (Login)</button>
        </div>
    </div>

    <div class="top-banner">
        📋 Sales Planner Pro
        <br><span id="userBadge" class="user-badge">...</span>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('missionTab', this)">🚀 បេសកកម្ម</button>
        <button class="tab-btn" onclick="switchTab('teamTab', this)">👥 ក្រុម (Team)</button>
        <button class="tab-btn" onclick="switchTab('reportTab', this)">📊 របាយការណ៍</button>
    </div>

    <div class="container">
        <!-- TAB 1: MISSION & ROUTE -->
        <div id="missionTab" class="tab-content">
            <div class="card">
                <h3>🚀 តាមដានខ្សែផ្លូវ និងបេសកកម្ម</h3>
                <button id="btnStartMission" class="btn" onclick="startMission()">▶️ ចុចផ្តើមការងារ (Start)</button>
                <button id="btnEndMission" class="btn btn-red" style="display:none;" onclick="endMission()">⏹️ ចុចបញ្ចប់ការងារ (End)</button>
                
                <div id="missionMapContainer"></div>
            </div>
        </div>

        <!-- TAB 2: TEAM MANAGEMENT -->
        <div id="teamTab" class="tab-content" style="display:none;">
            <div class="card">
                <h3>👥 ព័ត៌មានក្រុម (Team Dashboard)</h3>
                <div id="teamInfoBox" style="margin-bottom: 10px;"></div>
                
                <div id="leaderView" style="display:none;">
                    <p style="font-weight:bold; color:var(--accent);">📍 បញ្ជីសមាជិកក្នុងក្រុម (Real-time Tracker):</p>
                    <div id="teamMemberList"></div>
                </div>

                <div id="memberView" style="display:none;">
                    <p style="color:#16a34a; font-weight:bold;">✅ អ្នកកំពុងភ្ជាប់ជាមួយក្រុមរៀបរយហើយ។</p>
                </div>
            </div>
        </div>

        <!-- TAB 3: REPORT -->
        <div id="reportTab" class="tab-content" style="display:none;">
            <div class="card">
                <h3>📊 របាយការណ៍សង្ខេប</h3>
                <p>ទិន្នន័យការងារសរុបសម្រាប់គណនីនេះ។</p>
                <button class="btn btn-red" onclick="logout()">🚪 ចាកចេញ / ប្ដូរ PIN</button>
            </div>
        </div>
    </div>

    <script>
        // Telegram WebApp Initialization
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        let currentUser = { tgId: "local_user", name: "Guest User", role: "member", pin: "", teamCode: "TEAM-001" };

        // Optimization: Debounce Geolocation updates to save memory and battery
        let watchId = null;
        let missionMap = null;
        let currentPolyline = null;
        let activePoints = [];

        function initTelegramAuth() {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.expand(); // បើកពេញអេក្រង់ Telegram
                const user = tg.initDataUnsafe.user;
                currentUser.tgId = user.id.toString();
                currentUser.name = `${user.first_name || ''} ${user.last_name || ''}`.trim();
                document.getElementById('tgUserLabel').innerText = `Telegram: ${currentUser.name} (@${user.username || 'N/A'})`;
            } else {
                document.getElementById('tgUserLabel').innerText = "Telegram: ដំណើរការក្រៅ Telegram WebApp";
            }

            // ពិនិត្យការ Login មុនៗ
            const savedSession = localStorage.getItem('sales_team_session');
            if (savedSession) {
                currentUser = JSON.parse(savedSession);
                document.getElementById('authModal').style.display = 'none';
                updateUserUI();
            } else {
                document.getElementById('authModal').style.display = 'flex';
            }
        }

        function toggleTeamCodeField() {
            const role = document.getElementById('userRoleSelect').value;
            document.getElementById('teamCodeGroup').style.display = 'block';
        }

        function saveAuthAndLogin() {
            const pin = document.getElementById('userPinInput').value.trim();
            const role = document.getElementById('userRoleSelect').value;
            const teamCode = document.getElementById('teamCodeInput').value.trim() || "TEAM-001";

            if (pin.length !== 4 || isNaN(pin)) {
                alert("សូមបញ្ចូល PIN សម្ងាត់ ៤ ខ្ទង់ជាលេខ!");
                return;
            }

            currentUser.role = role;
            currentUser.pin = pin;
            currentUser.teamCode = teamCode;

            // រក្សាទុក Session Local លើទូរស័ព្ទ
            localStorage.setItem('sales_team_session', JSON.stringify(currentUser));
            document.getElementById('authModal').style.display = 'none';
            updateUserUI();
        }

        function updateUserUI() {
            document.getElementById('userBadge').innerText = `👤 ${currentUser.name} | 🔰 ${currentUser.role.toUpperCase()} | 🆔 ${currentUser.teamCode}`;
            
            // Render Team Tab status
            document.getElementById('teamInfoBox').innerHTML = `
                <b>ឈ្មោះ:</b> ${currentUser.name}<br>
                <b>កូដក្រុម:</b> <span style="color:var(--accent);">${currentUser.teamCode}</span><br>
                <b>តួនាទី:</b> ${currentUser.role === 'leader' ? '👑 មេក្រុម (Leader)' : '👤 កូនក្រុម (Member)'}
            `;

            if (currentUser.role === 'leader') {
                document.getElementById('leaderView').style.display = 'block';
                document.getElementById('memberView').style.display = 'none';
                loadTeamMembersData();
            } else {
                document.getElementById('leaderView').style.display = 'none';
                document.getElementById('memberView').style.display = 'block';
            }
        }

        /* TEAM DATA SIMULATION (អាចភ្ជាប់ Firebase/REST API នៅចំណុចនេះ) */
        function loadTeamMembersData() {
            // ទាញយកព័ត៌មានកូនក្រុម ដែលស្ថិតក្នុង TeamCode ជាមួយគ្នា
            const teamContainer = document.getElementById('teamMemberList');
            teamContainer.innerHTML = `
                <div class="team-member-item">
                    <div><b>Sok San (កូនក្រុម 1)</b><br><small style="color:green;">● កំពុងចុះបេសកកម្ម</small></div>
                    <button class="btn btn-blue" style="width:auto; padding:4px 8px;" onclick="alert('បង្ហាញ GPS កូនក្រុមនេះលើ Map')">មើលផ្លូវ</button>
                </div>
                <div class="team-member-item">
                    <div><b>Bora Kim (កូនក្រុម 2)</b><br><small style="color:gray;">○ ទំនេរ (No active mission)</small></div>
                    <button class="btn btn-blue" style="width:auto; padding:4px 8px; opacity:0.5;" disabled>មើលផ្លូវ</button>
                </div>
            `;
        }

        /* FAST GPS MAP TRACKING */
        function initMap() {
            if (missionMap) return;
            missionMap = L.map('missionMapContainer', { zoomControl: false }).setView([11.5564, 104.9282], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(missionMap);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    missionMap.setView([pos.coords.latitude, pos.coords.longitude], 15);
                    L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(missionMap).bindPopup("ទីតាំងអ្នក");
                });
            }
        }

        function startMission() {
            if (!navigator.geolocation) return alert("ទូរស័ព្ទលោកអ្នកមិនគាំទ្រ GPS ទេ!");

            document.getElementById('btnStartMission').style.display = 'none';
            document.getElementById('btnEndMission').style.display = 'block';

            activePoints = [];
            if (currentPolyline) missionMap.removeLayer(currentPolyline);
            currentPolyline = L.polyline([], { color: '#dc2626', weight: 5 }).addTo(missionMap);

            // កែសម្រួល Performance: បាញ់ទិន្នន័យ GPS រៀងរាល់ពេលមានការផ្លាស់ប្ដូរ
            watchId = navigator.geolocation.watchPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                activePoints.push([lat, lng]);

                currentPolyline.setLatLngs(activePoints);
                missionMap.panTo([lat, lng]);

                // ប្រសិនបើជាកូនក្រុម - អាចបាញ់ Coordinate នេះទៅ Cloud Database ឱ្យ មេក្រុមមើលឃើញ Real-time
            }, err => console.error(err), { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });
        }

        function endMission() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            document.getElementById('btnStartMission').style.display = 'block';
            document.getElementById('btnEndMission').style.display = 'none';
            alert("✅ បានបញ្ចប់បេសកកម្ម និងរក្សាទុកទិន្នន័យផ្លូវធ្វើដំណើរ!");
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');

            if (tabId === 'missionTab') {
                if (!missionMap) initMap();
                else setTimeout(() => missionMap.invalidateSize(), 200);
            }
        }

        function logout() {
            if (confirm("តើអ្នកប្រាកដជាចង់ចាកចេញ និងលុប Session នេះទេ?")) {
                localStorage.removeItem('sales_team_session');
                location.reload();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTelegramAuth();
            initMap();
        });
    </script>
</body>
</html>
