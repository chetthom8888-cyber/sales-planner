<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Sales Planner Pro</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #020617;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #020617;
            --red: #dc2626;
            --green: #16a34a;
            --orange: #ea580c;
            --border: #cbd5e1;
        }

        html, body {
            background-color: var(--bg) !important;
            color: var(--text) !important;
            font-family: 'Battambang', Arial, sans-serif;
            margin: 0; padding: 0;
            font-size: 13px;
            min-height: 100vh;
        }

        .top-banner {
            background: #020617; color: #ffffff !important;
            padding: 10px 16px; text-align: center;
            font-size: 14px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }

        .lang-select {
            background: #1e293b; color: #fff; border: 1px solid var(--border);
            padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
        }

        .nav-tabs {
            display: flex; background: #ffffff;
            border-bottom: 2px solid var(--border);
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1; padding: 10px 6px;
            text-align: center; font-size: 12px; font-weight: 700;
            background: #ffffff; border: none; cursor: pointer;
            color: #475569; border-bottom: 3px solid transparent; white-space: nowrap;
        }
        .tab-btn.active {
            color: var(--accent); border-bottom-color: var(--accent); background: #bae6fd;
        }

        .container { padding: 12px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
        .card {
            background: var(--card-bg); border-radius: 12px;
            padding: 14px; margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08); border: 1.5px solid var(--border);
        }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h3 { font-size: 14px; color: var(--primary); margin: 0; font-weight: 700; border-left: 4px solid var(--accent); padding-left: 8px; }

        .btn {
            background-color: var(--green); color: white !important; border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
            cursor: pointer; text-align: center; display: inline-block; box-sizing: border-box;
        }
        .btn-blue { background-color: var(--accent); } 
        .btn-red { background-color: var(--red); } 
        .btn-orange { background-color: var(--orange); }
        .btn-gray { background-color: #64748b; }
        .btn-sm { padding: 4px 8px; font-size: 11px; width: auto; }

        .btn-plus {
            background: var(--accent); color: white; border: 1px solid var(--border);
            width: 32px; height: 32px; border-radius: 50%; font-size: 18px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #020617; }
        
        input, select, textarea {
            width: 100%; padding: 10px; border: 1.5px solid var(--border);
            border-radius: 8px; font-size: 13px; font-family: 'Battambang', Arial, sans-serif;
            box-sizing: border-box; background: #ffffff !important; color: #020617 !important; outline: none; font-weight: 600;
        }

        .item-row-compact {
            display: flex; flex-direction: column; gap: 4px;
            padding: 10px; background: #f8fafc; border-radius: 8px;
            margin-bottom: 8px; border: 1.5px solid var(--border); font-size: 12px;
        }

        .badge-status {
            display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; color: white; margin-left: 6px;
        }
        .bg-interested { background-color: #16a34a; }
        .bg-not-interested { background-color: #dc2626; }
        .bg-thinking { background-color: #ea580c; }

        .action-btns { display: flex; gap: 6px; margin-top: 6px; }

        #missionMapContainer {
            height: 280px; width: 100%; border-radius: 8px;
            border: 1.5px solid var(--border); margin-top: 10px; position: relative; background: #e2e8f0;
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85); z-index: 10000; justify-content: center; align-items: center;
        }
        .modal-card {
            background: #ffffff; color: #020617; width: 88%; max-width: 420px; border-radius: 16px;
            padding: 20px; border: 2px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center;
        }
    </style>
</head>
<body>

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="modal-overlay" style="display:flex;">
        <div class="modal-card">
            <h2 id="txtLoginTitle" style="margin-top:0; color:#020617; font-size:16px;">🔑 ចូលប្រើប្រាស់ប្រព័ន្ធ (Log In)</h2>
            <div class="form-group" style="text-align:left;">
                <label id="lblUsername">ឈ្មោះគណនី (Username):</label>
                <input type="text" id="loginUsername" placeholder="ឧ. sale01">
            </div>
            <div class="form-group" style="text-align:left;">
                <label id="lblPassword">ពាក្យសម្ងាត់ (Password):</label>
                <input type="password" id="loginPassword" placeholder="******">
            </div>
            <button class="btn btn-blue" style="width:100%; padding:10px; margin-top:10px;" onclick="handleLogin()" id="btnLoginSubmit">ចូលប្រព័ន្ធ</button>
        </div>
    </div>

    <!-- TOP BANNER WITH LANGUAGE SELECTOR -->
    <div class="top-banner">
        <span id="appBannerTitle">📋 Sales Planner Pro</span>
        <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="km">🇰🇭 ភាសាខ្មែរ</option>
            <option value="en">🇬🇧 English</option>
            <option value="zh">🇨🇳 中文</option>
        </select>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tabMissionBtn" onclick="switchTab('missionTab', this)">🚀 បេសកកម្ម</button>
        <button class="tab-btn" id="tabVisitBtn" onclick="switchTab('visitTab', this)">📍 ជួបផ្ទាល់</button>
        <button class="tab-btn" id="tabOnlineBtn" onclick="switchTab('onlineTab', this)">💻 អនឡាញ</button>
        <button class="tab-btn" id="tabContactBtn" onclick="switchTab('contactTab', this)">📇 ទំនាក់ទំនង</button>
        <button class="tab-btn" id="tabReportBtn" onclick="switchTab('reportTab', this)">📊 របាយការណ៍</button>
    </div>

    <div class="container">
        <!-- TAB 1: MISSION TRACKER -->
        <div id="missionTab" class="tab-content">
            <div id="missionReportCaptureArea" class="card">
                <h3 id="txtMissionHeader">🚀 តាមដានបេសកកម្ម និងការធ្វើដំណើរ</h3>
                <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                    <button id="btnStartMission" class="btn" style="width:100%;" onclick="startMission()">▶️ ចុចផ្តើមការងារ</button>
                    <button id="btnEndMission" class="btn btn-red" style="width:100%; display:none;" onclick="endMission()">⏹️ ចុចបញ្ចប់ការងារ</button>
                </div>
                <div id="missionMapContainer"></div>
            </div>
        </div>

        <!-- TAB 2: VISIT -->
        <div id="visitTab" class="tab-content" style="display:none;">
            <div class="card">
                <div class="card-header-flex">
                    <h3 id="visitFormTitle">📍 អតិថិជនជួបផ្ទាល់</h3>
                    <button class="btn-plus" onclick="toggleForm('visitForm')">+</button>
                </div>
                <div id="visitForm" style="display:none; margin-top: 10px;">
                    <input type="hidden" id="editVisitIndex" value="-1">
                    <div class="form-group"><label id="lblCustName">ឈ្មោះអតិថិជន</label><input type="text" id="custName"></div>
                    <div class="form-group"><label id="lblCustAddress">អាសយដ្ឋាន</label><input type="text" id="custAddress"></div>
                    <div class="form-group"><label id="lblCustPhone">លេខទូរស័ព្ទ</label><input type="text" id="custPhone"></div>
                    <button class="btn btn-blue" style="width:100%;" onclick="saveCustomer()">រក្សាទុក</button>
                </div>
            </div>
            <div class="card"><div id="customerListContainer"></div></div>
        </div>

        <!-- TAB 3: ONLINE -->
        <div id="onlineTab" class="tab-content" style="display:none;">
            <div class="card">
                <div class="card-header-flex">
                    <h3 id="onlineFormTitle">💻 បញ្ជីអនឡាញ</h3>
                    <button class="btn-plus" onclick="toggleForm('onlineForm')">+</button>
                </div>
                <div id="onlineForm" style="display:none; margin-top: 10px;">
                    <input type="hidden" id="editOnlineIndex" value="-1">
                    <div class="form-group"><label>ឈ្មោះអតិថិជន</label><input type="text" id="onlineCustName"></div>
                    <div class="form-group"><label>ឈ្មោះទំនិញ</label><input type="text" id="onlineItemName"></div>
                    <button class="btn btn-blue" style="width:100%;" onclick="saveOnlineItem()">រក្សាទុក</button>
                </div>
            </div>
            <div class="card"><div id="onlineItemListContainer"></div></div>
        </div>

        <!-- TAB 4: CONTACTS -->
        <div id="contactTab" class="tab-content" style="display:none;">
            <div class="card">
                <div class="card-header-flex">
                    <h3 id="contactFormTitle">📇 បញ្ជីឈ្មោះទំនាក់ទំនង</h3>
                    <button class="btn-plus" onclick="toggleForm('contactForm')">+</button>
                </div>
                <div id="contactForm" style="display:none; margin-top: 10px;">
                    <div class="form-group"><label>ឈ្មោះ</label><input type="text" id="manualContactName"></div>
                    <div class="form-group"><label>លេខទូរស័ព្ទ</label><input type="text" id="manualContactInfo"></div>
                    <button class="btn btn-blue" style="width:100%;" onclick="saveManualContact()">រក្សាទុក</button>
                </div>
            </div>
            <div class="card"><div id="allContactsContainer"></div></div>
        </div>

        <!-- TAB 5: REPORTS & ACCOUNT -->
        <div id="reportTab" class="tab-content" style="display:none;">
            <div class="card">
                <h3 id="txtReportTitle">📊 របាយការណ៍សង្ខេប</h3>
                
                <!-- FILTER MONTHLY -->
                <div class="form-group" style="margin-top:10px;">
                    <label id="lblSelectMonth">📅 ជ្រើសរើសខែសម្រាប់មើលរបាយការណ៍៖</label>
                    <input type="month" id="reportMonthPicker" onchange="generateReport()">
                </div>

                <div id="reportSummaryBox" style="font-size: 12.5px; line-height: 1.6; background: #e0f2fe; padding: 12px; border-radius: 8px; font-weight:600; white-space: pre-line;"></div>
            </div>

            <div class="card">
                <h3 id="txtAccountTitle">👤 គណនីប្រើប្រាស់</h3>
                <p><b>User:</b> <span id="currentUserDisplay">...</span></p>
                <button class="btn btn-red" style="width:100%;" onclick="handleLogout()" id="btnLogout">🚪 ចាកចេញពីគណនី (Log Out)</button>
            </div>
        </div>
    </div>

    <script>
        /* DICTIONARY FOR MULTI-LANGUAGE */
        const i18n = {
            km: {
                bannerTitle: "📋 ជំនួយការផែនការលក់ Pro",
                mission: "🚀 បេសកកម្ម", visit: "📍 ជួបផ្ទាល់", online: "💻 អនឡាញ", contact: "📇 ទំនាក់ទំនង", report: "📊 របាយការណ៍",
                loginTitle: "🔑 ចូលប្រើប្រាស់ប្រព័ន្ធ", username: "ឈ្មោះគណនី:", password: "ពាក្យសម្ងាត់:", btnLogin: "ចូលប្រព័ន្ធ",
                startMission: "▶️ ចុចផ្តើមការងារ", endMission: "⏹️ ចុចបញ្ចប់ការងារ",
                selectMonth: "📅 ជ្រើសរើសខែសម្រាប់មើលរបាយការណ៍៖", logout: "🚪 ចាកចេញពីគណនី"
            },
            en: {
                bannerTitle: "📋 Sales Planner Pro",
                mission: "🚀 Mission", visit: "📍 Direct Visit", online: "💻 Online", contact: "📇 Contacts", report: "📊 Reports",
                loginTitle: "🔑 System Login", username: "Username:", password: "Password:", btnLogin: "Log In",
                startMission: "▶️ Start Mission", endMission: "⏹️ End Mission",
                selectMonth: "📅 Select Month for Report:", logout: "🚪 Log Out"
            },
            zh: {
                bannerTitle: "📋 销售计划 Pro",
                mission: "🚀 任务", visit: "📍 拜访", online: "💻 线上", contact: "📇 联系人", report: "📊 报告",
                loginTitle: "🔑 系统登录", username: "用户名:", password: "密码:", btnLogin: "登录",
                startMission: "▶️ 开始任务", endMission: "⏹️ 结束任务",
                selectMonth: "📅 选择月度报告：", logout: "🚪 退出登录"
            }
        };

        let currentLang = localStorage.getItem('app_lang') || 'km';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            let t = i18n[lang];

            document.getElementById('appBannerTitle').innerText = t.bannerTitle;
            document.getElementById('tabMissionBtn').innerText = t.mission;
            document.getElementById('tabVisitBtn').innerText = t.visit;
            document.getElementById('tabOnlineBtn').innerText = t.online;
            document.getElementById('tabContactBtn').innerText = t.contact;
            document.getElementById('tabReportBtn').innerText = t.report;
            
            document.getElementById('txtLoginTitle').innerText = t.loginTitle;
            document.getElementById('lblUsername').innerText = t.username;
            document.getElementById('lblPassword').innerText = t.password;
            document.getElementById('btnLoginSubmit').innerText = t.btnLogin;
            
            document.getElementById('btnStartMission').innerText = t.startMission;
            document.getElementById('btnEndMission').innerText = t.endMission;
            document.getElementById('lblSelectMonth').innerText = t.selectMonth;
            document.getElementById('btnLogout').innerText = t.logout;
        }

        /* ACCOUNT LOGIN / LOGOUT LOGIC */
        function checkAuth() {
            let user = localStorage.getItem('sales_logged_user');
            if (user) {
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('currentUserDisplay').innerText = user;
            } else {
                document.getElementById('loginModal').style.display = 'flex';
            }
        }

        function handleLogin() {
            let u = document.getElementById('loginUsername').value.trim();
            let p = document.getElementById('loginPassword').value.trim();
            if (u && p) {
                localStorage.setItem('sales_logged_user', u);
                checkAuth();
            } else {
                alert("Please enter username & password!");
            }
        }

        function handleLogout() {
            if (confirm("Log out?")) {
                localStorage.removeItem('sales_logged_user');
                checkAuth();
            }
        }

        /* DATA MANAGEMENT & MONTHLY REPORT */
        let customers = JSON.parse(localStorage.getItem('sales_customers')) || [];
        let onlineItems = JSON.parse(localStorage.getItem('sales_online')) || [];
        let manualContacts = JSON.parse(localStorage.getItem('sales_manual_contacts')) || [];

        function generateReport() {
            let selectedMonth = document.getElementById('reportMonthPicker').value; // e.g. "2026-05"
            let monthLabel = selectedMonth || "ទាំងអស់ (All)";

            let countVisit = customers.length;
            let countOnline = onlineItems.length;
            let countContact = manualContacts.length;

            let reportText = `📊 **របាយការណ៍សរុប [ខែ: ${monthLabel}]**\n` +
                `------------------------------------\n` +
                `📍 អតិថិជនជួបផ្ទាល់: ${countVisit} នាក់\n` +
                `💻 អតិថិជនអនឡាញ: ${countOnline} នាក់\n` +
                `📇 ទំនាក់ទំនងរក្សាទុក: ${countContact} នាក់\n`;

            document.getElementById('reportSummaryBox').innerText = reportText;
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block'; btn.classList.add('active');
            if (tabId === 'reportTab') generateReport();
        }

        function toggleForm(id) {
            let f = document.getElementById(id);
            f.style.display = f.style.display === 'none' ? 'block' : 'none';
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            changeLanguage(currentLang);
            document.getElementById('langSelect').value = currentLang;
            let today = new Date().toISOString().slice(0, 7);
            document.getElementById('reportMonthPicker').value = today;
        });
    </script>
</body>
</html>
